{% extends 'app/base.html' %}
{% block title %}Rejestracja — Email Bot{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <div class="rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/80 p-8 shadow-soft">
    <h1 class="text-2xl font-semibold mb-6">Utwórz konto</h1>
    {% if error %}<div data-translate-error class="mb-4 text-sm rounded-md bg-rose-50 dark:bg-rose-500/10 border border-rose-200 dark:border-rose-500/40 text-rose-700 dark:text-rose-300 px-4 py-3">{{ error }}</div>{% endif %}
  <form method="post" class="space-y-5">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-2" for="username">Nazwa użytkownika</label>
        <input id="username" name="username" required class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700/70 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/60 focus:border-brand-500" />
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-2" for="email">Adres e-mail</label>
        <input id="email" name="email" type="email" required class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700/70 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/60 focus:border-brand-500" />
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-2" for="password">Hasło</label>
        <input id="password" type="password" name="password" required minlength="6" class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700/70 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/60 focus:border-brand-500" />
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-2" for="language">Język</label>
          <select id="language" name="language" class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700/70 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/60 focus:border-brand-500">
            <option value="pl" selected>Polski</option>
            <option value="en">Angielski</option>
            <option value="de">Niemiecki</option>
            <option value="fr">Francuski</option>
            <option value="es">Hiszpański</option>
            <option value="it">Włoski</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-2" for="country">Kraj</label>
          <select id="country" name="country" class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700/70 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/60 focus:border-brand-500">
            <option value="PL" selected>Polska</option>
            <option value="US">Stany Zjednoczone</option>
            <option value="DE">Niemcy</option>
            <option value="FR">Francja</option>
            <option value="ES">Hiszpania</option>
            <option value="IT">Włochy</option>
            <option value="GB">Wielka Brytania</option>
          </select>
        </div>
      </div>
      <button class="w-full inline-flex justify-center items-center gap-2 rounded-md bg-brand-600 hover:bg-brand-700 text-white px-5 py-2.5 text-sm font-medium shadow-soft focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-600" type="submit">Zarejestruj się</button>
    </form>
    <p class="mt-6 text-xs text-slate-500 dark:text-slate-400">Masz już konto? <a href="/login" class="text-brand-600 dark:text-sky-400 hover:underline">Zaloguj się</a></p>
  </div>
</div>
{% endblock %}
